services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: kilipicks
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "npm run migrate && node src/app.js"
    env_file: .env
    environment:
      DB_HOST: mysql
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    build: .
    command: node src/admin/server.js
    env_file: .env
    environment:
      DB_HOST: mysql
    ports:
      - "3050:3050"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    # No healthcheck: admin/server.js has no equivalent /healthz route.
    # Reporting a status here would mean faking one.

volumes:
  mysql-data:
  uploads-data:
